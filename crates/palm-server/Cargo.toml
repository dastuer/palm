[package]
name = "palm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Palm server: turn your phone into a laptop touchpad (Phone-As-Laptop-Mouse)"

[[bin]]
name = "palm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rust-embed = "8"
mime_guess = "2"
qrcode = "0.14"
mdns-sd = "0.14"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWindow", "NSImageView", "NSImage", "NSTextField", "NSView", "NSControl", "NSGraphics", "NSCell", "NSScreen"] }
objc2-foundation = { version = "0.2", features = ["NSThread", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.2", features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation", "objc2-app-kit"] }
core-foundation = "0.10"
dispatch2 = { version = "0.3", default-features = false, features = ["alloc", "std"] }
image = { features = ["png"], version = "0.25.10", default-features = false }
tray-icon = { version = "0.19", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
libc = "0.2"
