<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <title>Palm 🐾</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="conn">
        <span id="dot" class="off"></span>
        <span id="rtt">—</span>
      </div>
      <nav id="tabs">
        <button id="tab-touch" class="tab on">触控</button>
        <button id="tab-keys" class="tab">键</button>
        <button id="tab-cfg" class="tab">⚙</button>
      </nav>
    </header>

    <main id="touchpad">
      <div id="hint">
        <span>单指点按</span><span>双指滚动</span><span>长按拖拽</span><span>双指点按=右键</span><span>三指切桌面</span>
      </div>
    </main>

    <section id="keys" class="panel hidden">
      <div class="row media-row">
        <button data-media="prev">⏮</button>
        <button data-media="play">▶/⏸</button>
        <button data-media="next">⏭</button>
        <button data-media="voldown">🔉−</button>
        <button data-media="mute">🔇</button>
        <button data-media="volup">🔊+</button>
      </div>
      <div class="row">
        <button data-key="esc">esc</button>
        <button data-key="tab">⇥</button>
        <button data-key="backspace" id="bs-btn">⌫</button>
        <button data-key="delete">⌦</button>
        <button data-key="space">␣</button>
        <button data-key="enter">↵</button>
      </div>
      <div class="row f-row">
        <button data-key="f1">F1</button><button data-key="f2">F2</button><button data-key="f3">F3</button>
        <button data-key="f4">F4</button><button data-key="f5">F5</button><button data-key="f6">F6</button>
        <button data-key="f7">F7</button><button data-key="f8">F8</button><button data-key="f9">F9</button>
        <button data-key="f10">F10</button><button data-key="f11">F11</button><button data-key="f12">F12</button>
      </div>
      <div class="row letters">
        <button data-char="q">q</button><button data-char="w">w</button><button data-char="e">e</button>
        <button data-char="r">r</button><button data-char="t">t</button><button data-char="y">y</button>
        <button data-char="u">u</button><button data-char="i">i</button><button data-char="o">o</button>
        <button data-char="p">p</button>
      </div>
      <div class="row letters">
        <button data-char="a">a</button><button data-char="s">s</button><button data-char="d">d</button>
        <button data-char="f">f</button><button data-char="g">g</button><button data-char="h">h</button>
        <button data-char="j">j</button><button data-char="k">k</button><button data-char="l">l</button>
      </div>
      <div class="row letters">
        <button data-char="z">z</button><button data-char="x">x</button><button data-char="c">c</button>
        <button data-char="v">v</button><button data-char="b">b</button><button data-char="n">n</button>
        <button data-char="m">m</button>
        <button data-char="-">-</button><button data-char="/">/</button>
      </div>
      <p class="tip">先点亮上方 ⌘⌥⌃⇧ 再按键 = 组合键</p>
    </section>

    <section id="cfg" class="panel hidden">
      <div class="ctl"><label>指针灵敏度 <output id="o-sens"></output></label>
        <input id="i-sens" type="range" min="0.3" max="3" step="0.1"></div>
      <div class="ctl"><label>滚动速度 <output id="o-scroll"></output></label>
        <input id="i-scroll" type="range" min="0.3" max="3" step="0.1"></div>
      <div class="ctl"><label>自然滚动（mac 方向）
        <input id="i-natural" type="checkbox" class="switch"></label></div>
      <div class="ctl"><label>轻点（tap 点击）
        <input id="i-tap" type="checkbox" class="switch"></label></div>
      <div class="ctl"><label>长按拖拽 <output id="o-lp"></output></label>
        <input id="i-lp" type="range" min="200" max="800" step="50"></div>
      <div class="ctl"><label>精确模式（关加速）
        <input id="i-precise" type="checkbox" class="switch"></label></div>
      <div class="ctl"><label>三指上滑
        <select id="i-g3u"><option value="mission_control">调度中心</option><option value="app_expose">APP 窗口</option><option value="space_left">左切桌面</option><option value="space_right">右切桌面</option><option value="none">无</option></select></label></div>
      <div class="ctl"><label>三指左右滑
        <select id="i-g3lr"><option value="space_left_right">左/右切桌面</option><option value="mission_control">调度中心</option><option value="none">无</option></select></label></div>
      <div class="ctl"><label>外观
        <select id="i-theme"><option value="auto">自动</option><option value="dark">深色</option><option value="light">浅色</option></select></label></div>
      <button id="unpair" class="danger">解除配对（需在电脑端重新扫码）</button>
      <p class="tip">建议手机与电脑连接同一 5GHz WiFi，延迟更低。</p>
    </section>

    <div id="paircard" class="overlay hidden">
      <div class="card">
        <h2>🐾 Palm 配对</h2>
        <div id="pair-body">
          <p>在<b>电脑端</b>运行 <code>palm</code>，用手机相机扫终端里的二维码即可。</p>
          <p class="sub">或粘贴电脑端显示的完整链接（含 #/t=…）：</p>
          <input id="pair-url" type="url" placeholder="http://192.168.x.x:8787/#/t=…">
          <button id="pair-go">连接</button>
        </div>
        <p id="pair-status" class="sub"></p>
        <button id="pair-close" class="ghost">关闭</button>
      </div>
    </div>

    <div id="pinentry" class="overlay hidden">
      <div class="card">
        <h2>输入配对 PIN</h2>
        <p class="sub">电脑端 palm.toml [pairing] pin</p>
        <input id="pin-input" type="text" inputmode="numeric" maxlength="4" placeholder="4 位 PIN">
        <button id="pin-go">确认</button>
      </div>
    </div>

    <footer id="keybar">
      <button class="mod" data-mod="cmd">⌘</button>
      <button class="mod" data-mod="opt">⌥</button>
      <button class="mod" data-mod="ctrl">⌃</button>
      <button class="mod" data-mod="shift">⇧</button>
      <span class="sep"></span>
      <button data-key="left">←</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="right">→</button>
      <span class="sep"></span>
      <button id="ime-toggle">⌨️</button>
    </footer>

    <input id="ime" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div id="toast"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
